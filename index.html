<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTEROIDS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id='container'>
        <canvas id='c'></canvas>
        <ul id='hud'>
            <li class='score'>SCORE: <span id='score'>0</span></li>
            <li class='weapon'>WEPON: <span id='wepon'>NORMAL BEAM</span></li>
            <li class='ammo' id='ammo-container'>
                <canvas id='ammo-chart' width='24' height='24'></canvas>
            </li>
        </ul>
        <div id='menu'>
            <h2 id='title'></h2>
            <div id='message'></div>
            <a href='#' id='start'>START</a>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
